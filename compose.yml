# Nombre fijo del proyecto: así contenedores y volumen no dependen del nombre de la carpeta
name: genairuiformacion2026

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    ports:
      # Solo desde este equipo (DBeaver, psql local); no queda expuesto a la red
      - "127.0.0.1:5432:5432"
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql (no en .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-api:
    build: ./python-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Mismas credenciales del .env; "postgres" es el nombre del servicio dentro de la red de Compose
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: nomic-embed-text
      CHAT_MODEL: llama3.2:3b
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./datos:/datos:ro
    depends_on:
      postgres:
        condition: service_healthy

  java-api:
    build: ./java-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # El heap tiene un máximo de 256 MiB; queda margen para memoria nativa de Java.
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
