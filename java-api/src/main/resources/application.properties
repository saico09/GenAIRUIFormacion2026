spring.application.name=java-api

# Compose pasa las mismas credenciales de PostgreSQL que usa la API Python.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# schema.sql crea solo lo que falta. Hibernate comprueba los tipos sin borrar nada.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=java
spring.jpa.open-in-view=false

server.port=8080

# Prometheus recoge contadores y buckets HTTP sin publicar otros endpoints internos.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
