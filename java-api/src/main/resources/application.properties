spring.application.name=java-api

# Compose pasa las mismas credenciales de PostgreSQL que usa la API Python.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# schema.sql migra el modelo compartido; aborta si dos identidades usan el mismo ID.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
# afterCompletion restaura archivos y libera el advisory lock antes de cerrar esta conexión.
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_HOLD
spring.jpa.open-in-view=false

server.port=8080

# Origenes exactos de la interfaz; una variable vacia deshabilita el acceso cruzado.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
app.history.dir=${APP_HISTORY_DIR:/historias}

# Prometheus recoge contadores y buckets HTTP sin publicar otros endpoints internos.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Actuator tiene su propio handler CORS; comparte los origenes explicitos de la UI.
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=Content-Type,X-Request-ID
management.endpoints.web.cors.exposed-headers=X-Request-ID
management.endpoints.web.cors.allow-credentials=false
