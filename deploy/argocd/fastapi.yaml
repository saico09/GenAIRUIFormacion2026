apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saico09/GenAIRUIFormacion2026.git
    targetRevision: main
    path: deploy/helm/fastapi
  destination:
    server: https://kubernetes.default.svc
    namespace: genai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
