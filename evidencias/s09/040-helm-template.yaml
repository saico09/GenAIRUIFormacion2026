---
# Source: fastapi/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: genai
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - name: http
      port: 8000
      targetPort: http

---
# Source: fastapi/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: genai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "genai-fastapi:s09"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: "192.168.65.254"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "genai"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: genai-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genai-postgres
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
