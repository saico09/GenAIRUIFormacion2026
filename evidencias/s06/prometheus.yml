global:
  scrape_interval: 15s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [python-api:8000]
        labels:
          service: fastapi

  - job_name: springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [java-api:8080]
        labels:
          service: springboot
